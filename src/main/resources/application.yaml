server:
  port: 8083

spring:
  application:
    name: evidence-service
  config:
    # Bucket name + shared settings come from the Config Server (surefix-config/evidence-service.yaml)
    import: configserver:${CONFIG_URL:http://localhost:8888}
  cloud:
    config:
      fail-fast: true   # exit if the Config Server is unreachable; PM2 restarts us until it is

surefix:
  storage:
    bucket: surefix-eca-evidence

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
